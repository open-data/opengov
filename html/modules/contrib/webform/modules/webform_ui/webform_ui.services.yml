services:
  webform_ui.path_processor:
    class: Drupal\webform_ui\PathProcessor\WebformUiPathProcessor
    tags:
      - {name: path_processor_outbound}

  Drupal\webform_ui\Hook\WebformUiHooks:
    class: Drupal\webform_ui\Hook\WebformUiHooks
    autowire: true

  webform_ui.route_subscriber:
    class: Drupal\webform_ui\Routing\WebformUiRouteSubscriber
    tags:
      - { name: event_subscriber }
