################
# Includes
#
# Additional configuration can be provided through includes.
# One advantage of include files is that if they are updated upstream, the changes affect all pipelines using that include.
#
# Includes can be overridden by re-declaring anything provided in an include, here in gitlab-ci.yml
# https://docs.gitlab.com/ee/ci/yaml/includes.html#override-included-configuration-values
################

include:
  ################
  # DrupalCI includes:
  # As long as you include this, any future includes added by the Drupal Association will be accessible to your pipelines automatically.
  # View these include files at https://git.drupalcode.org/project/gitlab_templates/
  ################
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Pipeline configuration variables
#
# These are the variables provided to the Run Pipeline form that a user may want to override.
#
# Docs at https://git.drupalcode.org/project/gitlab_templates/-/blob/1.0.x/includes/include.drupalci.variables.yml
################
variables:
  COMPOSER_ROOT_VERSION: '1.x-dev'
  _PHPUNIT_CONCURRENT: '1'
  _CSPELL_FLAGWORDS: please
  _CSPELL_IGNORE_PATHS: ./phpcs.xml
  # Provide the option to run other test suites as well.
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_DRUPAL_CMS: 1
  OPT_IN_TEST_MAX_PHP: 1
  # Uncomment to automatically run various optional tests:
#  _AUTORUN_PREVIOUS_MINOR: all
#  _AUTORUN_NEXT_MINOR: all
#  _AUTORUN_PREVIOUS_MAJOR: all
#  _AUTORUN_NEXT_MAJOR: all
#  _AUTORUN_DRUPAL_CMS: all
#  _AUTORUN_MAX_PHP: all

# Overrides for the "phpunit" job.
phpunit:
  variables:
    # For Drupal 11.5+.
    DRUPAL_DEPRECATION_FILTER_CONFIG: '{"projectIgnoreFile":"$CI_PROJECT_DIR/.ignored-deprecations.txt"}'
    # For older Drupal versions.
    # @todo Remove once we depend on Drupal 11.5+.
    SYMFONY_DEPRECATIONS_HELPER: "ignoreFile=$CI_PROJECT_DIR/.ignored-deprecations.txt"

.composer-base:
  after_script:
    # It seems the $INSTALLED_DRUPAL_VERSION variable set in "script" does not
    # survive to "after_script", so set it here again.
    - export INSTALLED_DRUPAL_VERSION=$(php -r "include '$CI_PROJECT_DIR/vendor/autoload.php'; echo \Drupal::VERSION;")
    # Just to spite every contrib module developer trying to stay up to date,
    # the "next minor" Drupal 11.5 system identifies as "11.4-dev". Fix that
    # with prejudice.
    - |
      if [ $INSTALLED_DRUPAL_VERSION = '11.4-dev' ] ; then
        export INSTALLED_DRUPAL_VERSION=11.5-dev
        sed -i 's/11\.4-dev/11.5-dev/g' "$CI_PROJECT_DIR/$_WEB_ROOT/core/lib/Drupal.php"
      fi
    # For newer versions of Drupal (11.5+), require "drupal/text_with_summary".
    - |
      if [[ $INSTALLED_DRUPAL_VERSION =~ ^(11\.[5-9]|12\.|13\.) ]]; then
        composer require --dev 'drupal/text_with_summary' '1.0.x-dev || 2.0.x-dev'
      fi

# Add support for running tests with Postgres.
.opt-in-postgres-rule: &opt-in-postgres-rule
  if: '$OPT_IN_TEST_POSTGRES != "1"'
  when: never

composer (postgres):
  extends: .composer-base
  rules:
    - *opt-in-postgres-rule
    - when: always
  variables:
    _TARGET_DB_VERSION: $CORE_PGSQL_MIN
    _TARGET_DB_TYPE: $POSTGRESQL

phpunit (postgres):
  extends: phpunit
  services:
    - !reference [ .with-database ]
    - !reference [ .with-chrome ]
  rules:
    - *opt-in-postgres-rule
    - !reference [ .skip-phpunit-rule ]
    - !reference [ .phpunit-tests-exist-rule ]
    - when: on_success
  needs:
    - "composer (postgres)"
  variables:
    SYMFONY_DEPRECATIONS_HELPER: "disabled"
    _TARGET_DB_VERSION: $CORE_PGSQL_MIN
    _TARGET_DB_TYPE: $POSTGRESQL

# Add support for running tests with SQLite.
.opt-in-sqlite-rule: &opt-in-sqlite-rule
  if: '$OPT_IN_TEST_SQLITE != "1"'
  when: never

composer (sqlite):
  extends: .composer-base
  rules:
    - *opt-in-sqlite-rule
    - when: always
  variables:
    _TARGET_DB_VERSION: $CORE_SQLITE_MIN
    _TARGET_DB_TYPE: $SQLITE

phpunit (sqlite):
  extends: phpunit
  services:
    - !reference [ .with-database ]
    - !reference [ .with-chrome ]
  rules:
    - *opt-in-sqlite-rule
    - !reference [ .skip-phpunit-rule ]
    - !reference [ .phpunit-tests-exist-rule ]
    - when: on_success
  needs:
    - "composer (sqlite)"
  variables:
    SYMFONY_DEPRECATIONS_HELPER: "disabled"
    _TARGET_DB_VERSION: $CORE_SQLITE_MIN
    _TARGET_DB_TYPE: $SQLITE
